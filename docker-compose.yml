services:
  postgres:
    image: postgres:16-alpine
    container_name: aqar-elite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aqar_elite}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aqar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aqar} -d ${POSTGRES_DB:-aqar_elite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aqar-elite-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aqar}:${POSTGRES_PASSWORD:-aqar_secret}@postgres:5432/${POSTGRES_DB:-aqar_elite}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-dev-secret-change-in-production-32ch}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-86400}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  aqar_pgdata:
