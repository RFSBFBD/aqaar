name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqar
          POSTGRES_PASSWORD: aqar_secret
          POSTGRES_DB: aqar_elite
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://aqar:aqar_secret@localhost:5432/aqar_elite?schema=public
      SESSION_SECRET: ci-test-session-secret-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Seed database (verify idempotency)
        run: |
          npm run db:seed
          npm run db:seed

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (PostgreSQL)
        run: npm run test:integration

      - name: Production build
        run: npm run build
